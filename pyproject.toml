[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-harness"
version = "0.1.0"
description = "Motor Agentic Autônomo e Instalável — Local-First AI Engineering Harness"
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.7.0",
    "jsonschema>=4,<5",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-jsonschema>=4.23",
    "ruff>=0.11.0",
    "build>=1.2.0",
]

[project.scripts]
harness = "ai_engineering_harness.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_engineering_harness.defaults" = ["*", "*/*", "*/*/*", "*/*/*/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["src"]
pretty = true
show_error_codes = true

[tool.ruff]
target-version = "py311"
line-length = 120
