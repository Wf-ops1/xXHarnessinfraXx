version: "1.0"
profile_name: "default"
context_sufficiency_threshold: 0.72
approval_policy: "strict"
data_egress:
  allowed_providers:
    - "openai"
    - "anthropic"
    - "local"
models:
  providers:
    openai:
      adapter: "openai"
      model: "gpt-4o"
      api_key_env: "OPENAI_API_KEY"
    anthropic:
      adapter: "anthropic"
      model: "claude-3-5-sonnet"
      api_key_env: "ANTHROPIC_API_KEY"
    local:
      adapter: "local"
      model: "llama3"
      base_url: "http://127.0.0.1:11434/v1"
  routing:
    primary_provider: "local"
    fallback_providers: []
budget:
  max_tokens: 100000
verification:
  enforce_applicable_only: true
