name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Validate lock and synchronize
        run: |
          uv lock --check
          uv sync --all-extras --locked
      - name: Validate encoding and documentation
        run: >-
          uv run python -m pytest
          tests/unit/test_encoding.py
          tests/unit/test_documentation.py
          tests/unit/test_ci_workflow.py
          -q
      - name: Compile Python sources
        run: uv run python -m compileall -q src compiler tests
      - name: Lint
        run: uv run python -m ruff check .
      - name: Type check
        run: uv run python -m mypy --strict src

  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Synchronize environment
        run: uv sync --all-extras --locked
      - name: Unit tests
        run: uv run python -m pytest tests/unit -q
      - name: End-to-end tests
        run: uv run python -m pytest tests/e2e -q

  package:
    name: Package / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Synchronize environment
        run: uv sync --all-extras --locked
      - name: Build distributions
        run: uv run python -m build
      - name: Inspect and smoke-test wheel
        run: uv run python tests/ci/smoke_wheel.py

  security-coverage:
    name: Security and coverage / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Validate lock and synchronize
        run: |
          uv lock --check
          uv sync --all-extras --locked
      - name: Enforce critical coverage and decision branches
        run: |
          uv run python -m pytest tests/unit tests/e2e -q --cov=ai_engineering_harness --cov-branch --cov-report=json:coverage.json
          uv run python tests/ci/check_f7_3_coverage.py coverage.json
      - name: Scan tracked files for secrets
        run: uv run python tests/ci/check_f7_3_security.py secrets
      - name: Audit synchronized dependencies
        run: uv run python tests/ci/check_f7_3_security.py dependencies

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs:
      - quality
      - tests
      - package
      - security-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job
        shell: bash
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ||
                "${{ needs.tests.result }}" != "success" ||
                "${{ needs.package.result }}" != "success" ||
                "${{ needs.security-coverage.result }}" != "success" ]]; then
            echo "A mandatory CI job failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All mandatory CI jobs succeeded."
